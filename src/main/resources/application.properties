spring.application.name=kinopoisk

# DATABASE (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/kinopoisk_bd
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate/JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# LIQUIBASE
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.sql
spring.liquibase.enabled=true

# KINOPOISK
kinopoisk.api.url=https://kinopoiskapiunofficial.tech
kinopoisk.api.key=8cc18fb6-35f0-4568-be03-ce46673bacb4
kinopoisk.api.v2.films=/api/v2.2/films

# KAFKA
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.kinopoisk.kafka
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.kinopoisk.kafka.FilmBatchMessage
spring.kafka.consumer.group-id=kinopoisk-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.concurrency=1
spring.kafka.listener.ack-mode=manual

# MAIL
